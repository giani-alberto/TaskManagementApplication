<h1>Task Management</h1>
<div>

  <input type="text" #taskInput placeholder="Titlu task...">
  
  <!-- Căsuța pentru descriere -->
  <input type="text" #descInput placeholder="Descriere...">
  

  <select #priorityInput>
    <option value="Low">Low</option>
    <option value="Normal" selected>Medium</option>
    <option value="High">High</option>
  </select>

<button (click)="addTask(taskInput.value, priorityInput.value, descInput.value)">Add Task</button>
</div>
<hr>
<ul>
  <li *ngFor="let task of tasks">   
    ID: {{task.id}} |
    <input type="checkbox" [checked]="task.isCompleted">

    <strong>{{ task.title }}</strong> 
    <span style="color: gray; font-size: 12px; margin-left: 10px;">(priority: {{ task.priority }})</span>
    
    <div style="font-size: 14px; color: #555; margin-left: 20px;">
      {{ task.description }}
    </div>
  </li>
</ul>
