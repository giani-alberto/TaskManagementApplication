<div class="app-container">
  <h1 class="page-title">Task Management</h1>
  
  <div class="add-task-form">
    <input type="text" #taskInput class="custom-input" placeholder="Task title...">
    <input type="text" #descInput class="custom-input" placeholder="Description...">
    
    <select #priorityInput class="custom-select">
      <option value="Low">Low</option>
      <option value="Normal" selected>Medium</option>
      <option value="High">High</option>
    </select>

    <button class="btn-primary" (click)="addTask(taskInput.value, priorityInput.value, descInput.value)">
      Add Task
    </button>
  </div>

  <hr class="divider">

  <div class="task-list">
  
    <div class="task-card" *ngFor="let task of tasks" [class.completed-task]="task.isCompleted">
      
      <div class="task-header">
        <div class="task-main-info">
          <input type="checkbox" class="custom-checkbox" [checked]="task.isCompleted" (change)="updateTask(task, $event)">
          <strong class="task-title">{{ task.title }}</strong>
          <span class="priority-badge" [ngClass]="task.priority.toLowerCase()">{{ task.priority }}</span>
        </div>
        
        <button class="btn-danger" (click)="deleteTask(task.id)">Delete</button>
      </div>

      <div class="task-body">
        <p class="task-description">{{ task.description }}</p>
        <span class="task-id">ID: {{ task.id }}</span>
      </div>

    </div>
  </div>
</div>
